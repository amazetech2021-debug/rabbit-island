<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐰 开心兔兔养成岛</title>
<!-- 语音引擎：豆包（中文）+ ElevenLabs（英文）+ 浏览器兜底 --><style>
:root{
  --cream:#FBF2E0; --cream-2:#F6E7CE; --paper:#FFFDF7;
  --ink:#3D2B1F; --ink-soft:#7A6A5C;
  --brand:#E2601C; --brand-deep:#C24A0E;
  --green:#4CAF50; --green-d:#3D8B40;
  --orange:#F5921E; --purple:#8B5CF6; --red:#E5443C;
  --blue:#3B82F6; --gold:#F5B301;
  --night-1:#1B2A4E; --night-2:#0D1730;
  --line:rgba(61,43,31,.10);
  --shadow:0 4px 14px rgba(120,80,40,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,var(--cream) 0%,var(--cream-2) 100%);
  color:var(--ink); user-select:none;
}
.app{display:flex;height:100%;}

/* ── 侧边栏 ── */
.side{
  width:92px;flex:0 0 92px;height:100%;overflow-y:auto;overflow-x:hidden;
  background:rgba(255,253,247,.72);backdrop-filter:blur(8px);
  border-right:1px solid var(--line);padding:10px 0 30px;
  scrollbar-width:none;
}
.side::-webkit-scrollbar{display:none}
.nav{position:relative;display:flex;flex-direction:column;align-items:center;
  gap:2px;padding:9px 0 7px;cursor:pointer;transition:background .15s;border-radius:14px;margin:2px 8px}
.nav .ico{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;
  font-size:27px;box-shadow:0 2px 6px rgba(120,80,40,.16)}
.nav .lb{font-size:12px;color:var(--ink-soft);font-weight:600}
.nav.on{background:rgba(226,96,28,.13)}
.nav.on .lb{color:var(--brand);font-weight:800}
.nav.on::before{content:"";position:absolute;left:-6px;top:14px;bottom:14px;width:4px;border-radius:3px;background:var(--brand)}
.nav .badge{position:absolute;top:4px;right:12px;min-width:18px;height:18px;border-radius:9px;background:var(--red);
  color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* ── 主区 ── */
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;flex:0 0 auto}
.title{font-size:23px;font-weight:900;color:var(--brand);letter-spacing:.5px;flex:1;
  text-shadow:0 2px 0 rgba(255,255,255,.6)}
.pill{display:flex;align-items:center;gap:5px;background:var(--paper);border-radius:22px;
  padding:8px 15px;font-weight:900;font-size:17px;box-shadow:var(--shadow)}
.pill.small{font-size:15px;padding:7px 12px}
.scroll{flex:1;overflow-y:auto;padding:4px 16px 40px;-webkit-overflow-scrolling:touch}

.card{background:var(--paper);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}

/* ── 兔兔 展示 ── */
.stage{
  position:relative;border-radius:24px;padding:26px 20px 22px;margin-bottom:14px;
  background:radial-gradient(120% 90% at 50% 0%,#7EC87E 0%,#5BA85B 45%,#3D8B40 100%);
  color:#fff;overflow:hidden;text-align:center;box-shadow:0 8px 22px rgba(30,80,30,.28)
}
.stage.hurt{background:radial-gradient(120% 90% at 50% 0%,#C87E7E 0%,#A85B5B 45%,#8B3D3D 100%)}
.stage.dead{background:radial-gradient(120% 90% at 50% 0%,#3A3A3A 0%,#232323 45%,#141414 100%)}
.star{position:absolute;color:#fff;opacity:.55;animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:.9}}
.pet{font-size:96px;line-height:1.05;display:inline-block;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45));
  animation:float 3.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.pet.shake{animation:shake .5s ease-in-out infinite}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-6px) rotate(-4deg)}75%{transform:translateX(6px) rotate(4deg)}}
.pet.gone{animation:none;filter:grayscale(1) brightness(.6)}
/* 图片素材位：静态图配上呼吸感，比一动不动自然得多 */
/* ── 小兔兔的动作系统 ── */
.rb, .rb *{transform-box:fill-box}
.rb{overflow:visible;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rb .rb-body {transform-origin:50% 100%; animation:rbBreath 3.4s ease-in-out infinite}
.rb .rb-head {transform-origin:50% 100%; animation:rbBob 3.4s ease-in-out infinite}
.rb .rb-earL {transform-origin:50% 100%; animation:rbEarL 5.7s ease-in-out infinite}
.rb .rb-earR {transform-origin:50% 100%; animation:rbEarR 6.9s ease-in-out infinite}
.rb .rb-shadow{transform-origin:50% 50%; animation:rbShadow 3.4s ease-in-out infinite}
.rb .rb-eye  {transform-origin:50% 50%; transition:transform .07s ease-out}
.rb .rb-eyes.blinking .rb-eye{transform:scaleY(.08)}
.rb .rb-mouth{transform-origin:50% 0%}
.rb .rb-all  {transform-origin:50% 100%}

@keyframes rbBreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.028,.982)}}
@keyframes rbBob   {0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2.5px) rotate(.7deg)}}
@keyframes rbEarL  {0%,84%,100%{transform:rotate(-8deg)}88%{transform:rotate(-19deg)}93%{transform:rotate(-2deg)}}
@keyframes rbEarR  {0%,78%,100%{transform:rotate(8deg)}83%{transform:rotate(20deg)}89%{transform:rotate(2deg)}}
@keyframes rbShadow{0%,100%{transform:scale(1)}50%{transform:scale(.93)}}

/* 反应 */
@keyframes rbHop{0%,100%{transform:translateY(0) scale(1,1)}
  14%{transform:translateY(4px) scale(1.07,.9)}
  42%{transform:translateY(-26px) scale(.95,1.08)}
  68%{transform:translateY(0) scale(1.07,.92)}
  84%{transform:translateY(0) scale(.98,1.03)}}
@keyframes rbTilt{0%,100%{transform:rotate(0)}28%{transform:rotate(-13deg)}62%{transform:rotate(8deg)}}
@keyframes rbChew{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45) translateY(1px)}}
@keyframes rbYawnM{0%,100%{transform:scaleY(1) scaleX(1)}35%,65%{transform:scaleY(3.2) scaleX(1.3)}}
@keyframes rbYawnE{0%,100%{transform:scaleY(1)}30%,70%{transform:scaleY(.15)}}

.rb.act-hop  .rb-all  {animation:rbHop .78s cubic-bezier(.3,1.4,.5,1)}
.rb.act-hop  .rb-earL {animation:rbEarL .5s ease-out}
.rb.act-hop  .rb-earR {animation:rbEarR .5s ease-out}
.rb.act-tilt .rb-head {animation:rbTilt .85s cubic-bezier(.4,1.5,.5,1)}
.rb.act-eat  .rb-mouth{animation:rbChew .2s ease-in-out 7}
.rb.act-eat  .rb-head {animation:rbBob .2s ease-in-out 7}
.rb.act-yawn .rb-mouth{animation:rbYawnM 1.4s ease-in-out}
.rb.act-yawn .rb-eye  {animation:rbYawnE 1.4s ease-in-out}

/* 生病：耳朵耷拉、眼睛半闭、呼吸变慢变浅 */
.rb.sick .rb-earL{animation:none;transform:rotate(38deg) translateY(6px)}
.rb.sick .rb-earR{animation:none;transform:rotate(-38deg) translateY(6px)}
.rb.sick .rb-eye {transform:scaleY(.42)}
.rb.sick .rb-body,.rb.sick .rb-head{animation-duration:5.6s}
.rb.sick .rb-blush{opacity:.1}
/* 离开：蜷缩、灰掉、飘 zzz */
.rb.gone{filter:grayscale(1) brightness(.62)}
.rb.gone .rb-body,.rb.gone .rb-head,.rb.gone .rb-earL,.rb.gone .rb-earR{animation:none}
.rb.gone .rb-earL{transform:rotate(52deg) translateY(10px)}
.rb.gone .rb-earR{transform:rotate(-52deg) translateY(10px)}
.rb.gone .rb-eye {transform:scaleY(.06)}
.rb.gone .rb-zzz{opacity:.75;animation:rbZzz 2.6s ease-in-out infinite}
@keyframes rbZzz{0%{opacity:0;transform:translateY(0)}30%{opacity:.8}100%{opacity:0;transform:translateY(-16px)}}

/* 粒子 */
.petp{position:fixed;font-size:22px;pointer-events:none;z-index:97;
  animation:petpFly 1.2s ease-out forwards}
@keyframes petpFly{0%{opacity:0;transform:translate(0,0) scale(.5)}
  15%{opacity:1;transform:translate(calc(var(--dx)*.3),-14px) scale(1.1)}
  100%{opacity:0;transform:translate(var(--dx),-72px) scale(.85)}}

.petimg{height:auto;object-fit:contain;display:inline-block;
  filter:drop-shadow(0 10px 16px rgba(0,0,0,.35));
  animation:breathe 3.6s ease-in-out infinite;transform-origin:50% 92%}
@keyframes breathe{
  0%,100%{transform:scale(1) translateY(0) rotate(0deg)}
  35%    {transform:scale(1.035) translateY(-3px) rotate(-.6deg)}
  70%    {transform:scale(1.015) translateY(-6px) rotate(.6deg)}
}
.petimg.shake{animation:shake .5s ease-in-out infinite}
.petimg.gone{animation:none;filter:grayscale(1) brightness(.6)}
.petname{font-size:26px;font-weight:900;margin:10px 0 2px;display:inline-flex;align-items:center;gap:10px}
.lv{background:#7C3AED;border-radius:14px;padding:4px 13px;font-size:15px;font-weight:800}
.bar{height:14px;border-radius:9px;background:rgba(255,255,255,.16);overflow:hidden;margin:10px 2px 8px}
.bar>i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#FFC93C,#F5921E);
  transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.bar.hp>i{background:linear-gradient(90deg,#7BE495,#38B24A)}
.bar.hp.low>i{background:linear-gradient(90deg,#FF8A80,#E5443C)}
.srow{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700;opacity:.94}
.hint{font-size:14.5px;opacity:.85;margin-top:9px;line-height:1.5}

.speech{display:flex;gap:10px;align-items:flex-start;background:#FFF6E0;border:2px dashed #EFC98A;
  border-radius:18px;padding:13px 15px;margin-bottom:14px;font-size:16px;font-weight:700;line-height:1.5}

/* ── 按钮 ── */
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.big{border:none;border-radius:20px;padding:20px 10px;font-size:19px;font-weight:900;color:#fff;
  cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.16);transition:transform .08s;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:5px}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.16)}
.big .e{font-size:28px}
.big.g{background:var(--green)} .big.o{background:var(--orange)}
.big.p{background:var(--purple)} .big.r{background:var(--red)} .big.b{background:var(--blue)}
.big[disabled]{background:#C9BFB2;box-shadow:0 4px 0 rgba(0,0,0,.10);cursor:default}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--paper);border-radius:18px;padding:16px 10px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:30px;font-weight:900;line-height:1.15}
.stat span{font-size:13.5px;color:var(--ink-soft);font-weight:700}

/* ── 标签页 ── */
.tabs{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}
/* 分类多的时候改成单行横滑，别把半屏都占掉 */
.tabs.oneline{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;
  margin-bottom:12px;padding:2px 0 6px;scroll-behavior:smooth}
.tabs.oneline::-webkit-scrollbar{display:none}
.tabs.oneline .tab{flex:0 0 auto;white-space:nowrap}
.tabwrap{position:relative}
.tabwrap::after{content:"";position:absolute;right:0;top:0;bottom:6px;width:26px;
  pointer-events:none;background:linear-gradient(90deg,transparent,var(--cream-2))}
.tabwrap.atend::after{opacity:0;transition:opacity .2s}
.tab{background:var(--paper);border:none;border-radius:18px;padding:10px 17px;font-size:15.5px;font-weight:800;
  color:var(--ink);cursor:pointer;box-shadow:0 2px 5px rgba(120,80,40,.10);font-family:inherit;transition:transform .08s}
.tab:active{transform:scale(.96)}
.tab.on{background:var(--purple);color:#fff}
.tab.on.gr{background:var(--green)}

/* ── 学习卡片 ── */
.learn{text-align:center;padding:22px 18px}
.pic{font-size:82px;line-height:1;margin-bottom:6px}
.py{font-size:26px;color:var(--green-d);font-weight:800;letter-spacing:1px;margin-bottom:2px}
.hz{font-size:88px;font-weight:900;color:var(--brand);line-height:1.15;margin:2px 0 10px;cursor:pointer}
.words{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:14px;background:#fff;border-radius:16px;
  padding:11px 20px;font-size:20px;font-weight:800;box-shadow:0 2px 6px rgba(120,80,40,.10)}
.story{display:flex;gap:9px;background:#E8F1FE;border-radius:16px;padding:13px 15px;margin-top:16px;
  font-size:15.5px;text-align:left;line-height:1.55;font-weight:600}
.story b{color:#1D4ED8}
.trio{display:flex;flex-direction:column;align-items:center;gap:11px;margin-top:18px}
.trio .row{display:flex;gap:11px;justify-content:center;width:100%}
.trio .big{flex:1;padding:16px 8px;font-size:17px;flex-direction:row}
.meta{text-align:center;font-size:14.5px;color:var(--ink-soft);font-weight:700;margin-top:12px}

/* ── 数学 ── */
.qhead{display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:800;margin-bottom:12px}
.qhead .ok{color:var(--green-d)}
.expr{text-align:center;font-size:56px;font-weight:900;letter-spacing:3px;margin:6px 0 16px}
.expr .op{color:var(--red)} .expr .eq{color:var(--blue)} .expr .q{color:var(--orange)}
.viz{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.dots{display:grid;gap:4px}
.dots span{font-size:30px;line-height:1}
.viz .lab{font-size:22px;font-weight:900;color:var(--red);writing-mode:vertical-rl;letter-spacing:3px}
.viz .lab.k{color:var(--ink)}
.ansrow{display:flex;gap:12px;justify-content:center;align-items:center;margin-bottom:16px}
.ans{min-width:110px;height:62px;border:3px solid var(--orange);border-radius:16px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:var(--ink)}
.ans.right{border-color:var(--green);background:#EAF7EB}
.ans.wrong{border-color:var(--red);background:#FDECEB;animation:nope .4s}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.confirm{border:none;border-radius:16px;background:var(--green);color:#fff;font-size:20px;font-weight:900;
  padding:0 26px;height:62px;cursor:pointer;font-family:inherit;box-shadow:0 4px 0 var(--green-d)}
.confirm:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.key{border:none;background:var(--paper);border-radius:16px;height:64px;font-size:26px;font-weight:800;
  color:var(--ink);cursor:pointer;font-family:inherit;box-shadow:0 3px 0 rgba(120,80,40,.14)}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(120,80,40,.14)}
.key.del{background:#FDECEB;color:var(--red)} .key.go{background:#EAF7EB;color:var(--green-d)}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.choice{border:none;background:var(--paper);border-radius:18px;padding:20px 8px;font-size:28px;font-weight:900;
  color:var(--ink);cursor:pointer;font-family:inherit;box-shadow:0 3px 0 rgba(120,80,40,.14)}
.choice:active{transform:translateY(2px)}
.choice.right{background:#EAF7EB;color:var(--green-d)} .choice.wrong{background:#FDECEB;color:var(--red)}
.choice.sm{font-size:21px;padding:17px 8px}

/* ── 商店 / 任务 ── */
.shop{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:var(--paper);border-radius:20px;padding:16px 12px;text-align:center;box-shadow:var(--shadow)}
.item .e{font-size:44px;line-height:1}
.item .n{font-size:16.5px;font-weight:800;margin:7px 0 2px}
.item .d{font-size:12.5px;color:var(--ink-soft);font-weight:600;min-height:32px;line-height:1.35}
.buy{width:100%;border:none;border-radius:14px;background:var(--orange);color:#fff;font-size:15.5px;
  font-weight:800;padding:11px 0;margin-top:8px;cursor:pointer;font-family:inherit;box-shadow:0 3px 0 #C9740F}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #C9740F}
.buy[disabled]{background:#C9BFB2;box-shadow:0 3px 0 #A99C8C}
.buy.own{background:var(--green);box-shadow:0 3px 0 var(--green-d)}
.task{display:flex;align-items:center;gap:13px;background:var(--paper);border-radius:18px;padding:14px 16px;
  margin-bottom:11px;box-shadow:var(--shadow)}
.task .e{font-size:30px}
.task .t{flex:1}
.task .t b{display:block;font-size:16.5px;font-weight:800}
.task .t span{font-size:13.5px;color:var(--ink-soft);font-weight:600}
.task .rw{font-size:15px;font-weight:900;color:var(--orange);white-space:nowrap}
.task.done{opacity:.55}
.task.done .rw{color:var(--green-d)}
.tbar{height:8px;border-radius:5px;background:rgba(61,43,31,.10);overflow:hidden;margin-top:6px}
.tbar>i{display:block;height:100%;background:var(--orange);border-radius:5px;transition:width .4s}

/* ── 绘本 / 古诗 / 科普 ── */
.poem{text-align:center;padding:26px 18px}
.poem h2{font-size:30px;font-weight:900;color:var(--brand);margin:0 0 3px}
.poem .au{font-size:15px;color:var(--ink-soft);font-weight:700;margin-bottom:20px}
.poem p{font-size:25px;font-weight:800;line-height:2.05;letter-spacing:3px;margin:0}
.tonerow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tonechip{border:none;background:#fff;border-radius:14px;padding:10px 4px;cursor:pointer;
  font-family:inherit;box-shadow:0 2px 5px rgba(120,80,40,.12);transition:transform .08s;
  display:flex;flex-direction:column;align-items:center;gap:3px}
.tonechip:active{transform:scale(.94);background:#FFF3D0}
.tonechip b{font-size:22px;color:var(--green-d);font-weight:800}
.tonechip span{font-size:11.5px;color:var(--ink-soft);font-weight:700}
.pline{margin-bottom:8px;padding:6px 10px;border-radius:14px;cursor:pointer;
  transition:background .25s,transform .25s}
.pline .ptext{font-size:25px;font-weight:800;letter-spacing:3px}
.pline.on{background:linear-gradient(90deg,#FFF3D0,#FFE4B0);transform:scale(1.04)}
.pline.on .ptext{color:var(--brand)}
.poem .py2{font-size:13px;color:var(--green-d);font-weight:700;letter-spacing:1px;display:block;margin-bottom:-6px}
.poem .mean{margin-top:20px;text-align:left}
.book{text-align:center;padding:22px 18px}
.book .sc{font-size:76px;line-height:1.1;margin-bottom:12px}
.book .tx{font-size:19px;font-weight:700;line-height:1.75;min-height:96px}
.qa{background:var(--paper);border-radius:20px;padding:17px;margin-bottom:12px;box-shadow:var(--shadow)}
.qa .q{font-size:17.5px;font-weight:900;color:var(--brand);display:flex;gap:9px;align-items:flex-start}
.qa .a{font-size:15.5px;font-weight:600;line-height:1.6;margin-top:9px;color:var(--ink)}
.qa .a.hide{display:none}

/* ── 思维 ── */
.grid5{display:grid;gap:9px;justify-content:center}
.cell{background:var(--paper);border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 rgba(120,80,40,.13);
  aspect-ratio:1;min-height:54px}
.cell:active{transform:translateY(2px)}
.cell.hit{background:#EAF7EB;color:#9CCFA0}
.cell.flip{background:#fff}
.cell.matched{background:#EAF7EB}
.seq{display:flex;gap:10px;justify-content:center;align-items:center;font-size:38px;flex-wrap:wrap;margin-bottom:18px}
.seq .blank{width:56px;height:56px;border:3px dashed var(--orange);border-radius:14px;display:flex;
  align-items:center;justify-content:center;font-size:28px;color:var(--orange)}

/* ── 提示 / 弹窗 ── */
#toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%) translateY(24px);opacity:0;
  background:rgba(35,25,18,.93);color:#fff;padding:13px 24px;border-radius:26px;font-size:16.5px;
  font-weight:800;pointer-events:none;transition:.28s;z-index:99;max-width:80%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ══════════ 小白兔养成岛样式 ══════════ */
.rabbit-wrap *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.rabbit-wrap{color:#2c4a2e;font-family:var(--font);font-size:15px;line-height:1.6}
.rabbit-wrap .rtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--paper);border:2px solid var(--line,#cfe0bd);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);margin-bottom:12px}
.rabbit-wrap .rbrand{font-size:17px;font-weight:700}
.rabbit-wrap .rbrand small{display:block;font-size:10px;font-weight:400;color:var(--ink-soft);letter-spacing:2px}
.rabbit-wrap .rgrowth{flex:1;min-width:180px;display:flex;align-items:center;gap:8px}
.rabbit-wrap .rgrowth svg{width:130px;height:32px;flex:none}
.rabbit-wrap .rgrowth .rlv{font-size:12px;color:var(--ink-soft);white-space:nowrap}
.rabbit-wrap .rgrowth .rlv b{display:block;font-size:14px;color:var(--ink)}
.rabbit-wrap .rpurse{display:flex;align-items:baseline;gap:4px;padding:5px 12px;background:var(--orange,#ef7a2e);color:#fff;border-radius:12px;cursor:pointer;user-select:none;font-size:11px}
.rabbit-wrap .rpurse .rn{font-family:var(--num);font-size:22px;font-weight:700}
.rabbit-wrap .riconbtn{border:2px solid var(--line,#cfe0bd);background:var(--paper);color:var(--ink);width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer;flex:none}
.rabbit-wrap .riconbtn[aria-pressed="false"]{opacity:.4}
.rabbit-wrap .rmain{display:grid;grid-template-columns:260px 1fr;gap:12px;align-items:start}
.rabbit-wrap .rpanel{background:var(--paper);border:2px solid var(--line,#cfe0bd);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.rabbit-wrap .rpanel h2{margin:0 0 8px;font-size:14px;letter-spacing:1px}
.rabbit-wrap .rpanel h2 span{float:right;font-family:var(--num);font-size:12px;color:var(--ink-soft)}
.rabbit-wrap .rscreen{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:#dfe9d3;border:2px solid var(--line,#cfe0bd)}
.rabbit-wrap .rscreen video,.rabbit-wrap .rscreen .ridle{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.rabbit-wrap .rscreen video{opacity:0}
.rabbit-wrap .rscreen.playing video{opacity:1}
.rabbit-wrap .rscreen.playing .ridle,.rabbit-wrap .rscreen.playing .rrest{opacity:0}
.rabbit-wrap .rscreen .rrest{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;text-align:center;color:var(--ink);font-size:11px;line-height:1.4;background:linear-gradient(to top,rgba(255,253,246,.94),rgba(255,253,246,0))}
.rabbit-wrap .rbubble{margin-top:10px;background:var(--field,#e7f0da);border:2px solid var(--line,#cfe0bd);border-radius:12px;padding:8px 10px;font-size:14px;min-height:52px;position:relative}
.rabbit-wrap .rbubble::before{content:"";position:absolute;top:-9px;left:24px;width:14px;height:14px;background:var(--field,#e7f0da);border-left:2px solid var(--line,#cfe0bd);border-top:2px solid var(--line,#cfe0bd);transform:rotate(45deg)}
.rabbit-wrap .rhug{width:100%;margin-top:8px;padding:8px;border-radius:12px;cursor:pointer;border:2px dashed #f4a9c0;background:var(--paper);color:#c85c18;font-family:var(--font);font-size:14px}
.rabbit-wrap .rtgroup{margin-bottom:10px}
.rabbit-wrap .rtgroup>p{margin:0 0 4px;font-size:11px;color:var(--ink-soft);letter-spacing:1px}
.rabbit-wrap .rtask{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 10px;margin-bottom:5px;border-radius:11px;cursor:pointer;border:2px solid var(--line,#cfe0bd);background:var(--field,#e7f0da);font-family:var(--font);font-size:14px;color:var(--ink)}
.rabbit-wrap .rtask .rbox{width:20px;height:20px;flex:none;border-radius:6px;border:2px solid var(--ink-soft,#6f8d70);background:var(--paper);display:grid;place-items:center;font-size:12px;color:#fff}
.rabbit-wrap .rtask .rval{margin-left:auto;font-family:var(--num);font-size:12px;color:#c85c18}
.rabbit-wrap .rtask[data-done="1"]{background:#dff0d0;border-color:var(--orange,#ef7a2e)}
.rabbit-wrap .rtask[data-done="1"] .rbox{background:var(--orange,#ef7a2e);border-color:var(--orange,#ef7a2e)}
.rabbit-wrap .rtask[data-done="1"] .rname{text-decoration:line-through;color:var(--ink-soft)}
.rabbit-wrap .rstreak{font-size:12px;color:var(--ink-soft);border-top:2px dotted var(--line,#cfe0bd);padding-top:6px}
.rabbit-wrap .rstreak b{font-family:var(--num);color:#c85c18;font-size:15px}
.rabbit-wrap .rshop{margin-top:12px}
.rabbit-wrap .rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rabbit-wrap .ritem{border:2px solid var(--line,#cfe0bd);background:var(--field,#e7f0da);border-radius:14px;padding:6px;cursor:pointer;text-align:center;font-family:var(--font);color:var(--ink);font-size:14px}
.rabbit-wrap .ritem .rthumb{aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:#dfe9d3;margin-bottom:5px;position:relative}
.rabbit-wrap .ritem .rthumb img{width:100%;height:100%;object-fit:cover;display:block}
.rabbit-wrap .ritem .rnm{font-size:13px;line-height:1.3}
.rabbit-wrap .ritem .rpr{font-family:var(--num);font-size:11px;color:#c85c18;margin-top:2px}
.rabbit-wrap .ritem .rkd{position:absolute;top:4px;left:4px;font-size:9px;padding:1px 5px;border-radius:6px;background:rgba(255,253,246,.92);color:var(--ink-soft)}
.rabbit-wrap .ritem[data-state="locked"] .rthumb img{filter:grayscale(1) brightness(1.1);opacity:.45}
.rabbit-wrap .ritem[data-state="locked"] .rthumb::after{content:"🔒";position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
.rabbit-wrap .ritem[data-state="afford"]{border-color:var(--orange,#ef7a2e);background:#fff2e6}
.rabbit-wrap .ritem[data-state="owned"]{border-color:#f4a9c0}
.rabbit-wrap .ritem[data-state="owned"] .rpr::before{content:"已拥有 · 点我重播";}
.rabbit-wrap .ritem[data-state="owned"] .rpr{color:#f4a9c0;font-family:var(--font)}
.rabbit-wrap .ritem[data-state="owned"] .rpr span{display:none}
.rabbit-wrap .rparent{display:none;margin-top:12px}
.rabbit-wrap .rparent.on{display:block}
.rabbit-wrap .rparent .rrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rabbit-wrap .rparent button{border:2px solid var(--line,#cfe0bd);background:var(--field,#e7f0da);border-radius:10px;padding:6px 10px;cursor:pointer;font-family:var(--font);font-size:13px;color:var(--ink)}
.rabbit-wrap .rparent .rwarn{border-color:#e8b4b4;background:#fbeeee}
.rabbit-wrap .rparent p.rtip{margin:6px 0 0;font-size:11px;color:var(--ink-soft)}
@media (max-width:720px){
  .rabbit-wrap .rmain{grid-template-columns:1fr}
  .rabbit-wrap .rscreen{max-width:280px;margin:0 auto}
  .rabbit-wrap .rgrid{grid-template-columns:repeat(2,1fr)}
  .rabbit-wrap .rgrowth{order:3;width:100%}
}

/* ══════════════════════════════════════════════════════════════
   拼音发音引擎
   ──────────────────────────────────────────────────────────────
   为什么不能直接把 "b" "a" 丢给 TTS：中文引擎会当成英文字母念。
   为什么也不能只靠"近似汉字"：
     · 韵母 eng / ong / ei 在普通话里根本没有独立汉字，
       用「哼 hēng」「轰 hōng」会多出一个 h 声母，等于教错；
     · 「啊」「呢」「了」的首选读音是轻声，读出来含混不清；
     · 「佛」首选读 fú（仿佛），不是声母 f 的 fō。
   所以主用 SSML 音标标注 <phoneme alphabet="sapi" ph="a1">，
   直接指定拼音+声调，引擎按音标发音，不经过汉字。
   汉字只作为音标不被支持时的兜底。
   ══════════════════════════════════════════════════════════════ */

/* 兜底汉字（已按实际读音校正过；无合适汉字的留空，只走音标） */
const PINYIN_TTS = {
  // 声母呼读音，一律一声
  "bo":"波","po":"坡","mo":"摸","fo":"","de":"","te":"","ne":"讷","le":"勒",
  "ge":"哥","ke":"科","he":"喝","ji":"鸡","qi":"七","xi":"西",
  "zhi":"知","chi":"吃","shi":"师","ri":"日","zi":"资","ci":"","si":"思","yi":"衣","wu":"屋",
  // 韵母
  "a":"阿","o":"喔","e":"婀","i":"衣","u":"乌","ü":"迂",
  "ai":"哀","ei":"","ui":"威","ao":"凹","ou":"欧","iu":"优",
  "ie":"耶","üe":"约","er":"儿","an":"安","en":"恩","in":"音","un":"温","ün":"晕",
  "ang":"肮","eng":"","ing":"英","ong":"",
  // 整体认读
  "yu":"鱼","ye":"耶","yue":"约","yuan":"冤","yin":"音","yun":"晕","ying":"英"
};
/* 真正不能单独成音节的只有这两个：普通话里没有 eng、ong 开头的独立音节 */
const NO_SOLO = {"eng":"d-eng → dēng（灯）","ong":"h-ong → hóng（红）"};
/* 这些能单读，但单独成音节时要按规则改写 —— 一年级的常考点 */
const SOLO_FORM = {
  "i":"yi（衣）","u":"wu（屋）","ü":"yu（鱼）","ui":"wei（威）","iu":"you（优）",
  "ie":"ye（耶）","üe":"yue（月）","in":"yin（音）","un":"wen（温）","ün":"yun（云）",
  "ing":"ying（英）"
};

function pinyinTTS(p){ return PINYIN_TTS[p] || p; }

/* 带调号的拼音 → sapi 数字式（bā → ba1，lǜ → lv4） */
function pyToNum(s){
  const M = {'ā':['a',1],'á':['a',2],'ǎ':['a',3],'à':['a',4],
             'ō':['o',1],'ó':['o',2],'ǒ':['o',3],'ò':['o',4],
             'ē':['e',1],'é':['e',2],'ě':['e',3],'è':['e',4],
             'ī':['i',1],'í':['i',2],'ǐ':['i',3],'ì':['i',4],
             'ū':['u',1],'ú':['u',2],'ǔ':['u',3],'ù':['u',4],
             'ǖ':['v',1],'ǘ':['v',2],'ǚ':['v',3],'ǜ':['v',4]};
  let tone = 0, out = '';
  for(const ch of String(s)){
    if(M[ch]){ out += M[ch][0]; tone = M[ch][1]; }
    else if(ch === 'ü') out += 'v';
    else out += ch;
  }
  return {syl: out.toLowerCase().replace(/[^a-z]/g,''), tone: tone || 1};
}

/* 拼音音节直接用映射汉字（bo→波），走豆包 */
function speakSyllable(py, tone, fallbackChar){
  const fb = fallbackChar || '';
  if(fb) speak(fb, 'zh-CN');
}

/* 声母/韵母大字：一律读本音（一声），日除外 */
function speakPinyinItem(syllable){
  const t = (syllable === 'ri') ? 4 : 1;
  speakSyllable(syllable, t, PINYIN_TTS[syllable] || '');
}

/* 把"一声：bā 八｜二声：bá 拔"或"ā 阿 | á 啊"解析成可点的四声条 */
function parseTones(str){
  if(!str) return [];
  const re = /([a-zü]*[āáǎàōóǒòēéěèīíǐìūúǔùǖǘǚǜ][a-zünɡ]*)\s*[:：]?\s*([\u4e00-\u9fa5]?)/gi;
  const out = []; let m;
  while((m = re.exec(str)) !== null){
    const py = m[1], ch = m[2] || '';
    const r = pyToNum(py);
    if(!r.syl) continue;
    out.push({py, ch, syl:r.syl, tone:r.tone});
  }
  return out.slice(0, 4);
}
function toneChipsHTML(str){
  const list = parseTones(str);
  if(!list.length) return '';
  const names = ['一声','二声','三声','四声'];
  return '<div class="tonerow">' + list.map(t =>
    `<button class="tonechip" onclick="speakSyllable('${t.syl}',${t.tone},'${t.ch}')">
       <b>${t.py}</b><span>${names[t.tone-1]||''}${t.ch?' · '+t.ch:''}</span></button>`
  ).join('') + '</div>';
}

 ["静夜思","唐·李白",
  ["床前明月光，","疑是地上霜。","举头望明月，","低头思故乡。"],
  "月光洒在床前，像地上结了霜。抬头看看月亮，低下头就想起了家乡。",
  ["chuáng qián míng yuè guāng，","yí shì dì shàng shuāng。","jǔ tóu wàng míng yuè，","dī tóu sī gù xiāng。"], 1],
 ["春晓","唐·孟浩然",
  ["春眠不觉晓，","处处闻啼鸟。","夜来风雨声，","花落知多少。"],
  "春天睡得香，天亮了都不知道，到处都是鸟叫声。昨晚刮风下雨，不知道吹落了多少花。",
  ["chūn mián bù jué xiǎo，","chù chù wén tí niǎo。","yè lái fēng yǔ shēng，","huā luò zhī duō shǎo。"], 1],
 ["悯农（其二）","唐·李绅",
  ["锄禾日当午，","汗滴禾下土。","谁知盘中餐，","粒粒皆辛苦。"],
  "农民中午顶着大太阳锄地，汗水滴到泥土里。碗里的每一粒米，都是辛苦种出来的。",
  ["chú hé rì dāng wǔ，","hàn dī hé xià tǔ。","shuí zhī pán zhōng cān，","lì lì jiē xīn kǔ。"], 1],
 ["登鹳雀楼","唐·王之涣",
  ["白日依山尽，","黄河入海流。","欲穷千里目，","更上一层楼。"],
  "太阳靠着山落下去，黄河奔向大海。想看得更远，就要再爬高一层。",
  ["bái rì yī shān jìn，","huáng hé rù hǎi liú。","yù qióng qiān lǐ mù，","gèng shàng yī céng lóu。"], 1],
 ["江雪","唐·柳宗元",
  ["千山鸟飞绝，","万径人踪灭。","孤舟蓑笠翁，","独钓寒江雪。"],
  "山里一只鸟都没有，路上一个人影也不见。只有一个老爷爷披着蓑衣，独自在雪天钓鱼。",
  ["qiān shān niǎo fēi jué，","wàn jìng rén zōng miè。","gū zhōu suō lì wēng，","dú diào hán jiāng xuě。"], 1],
 ["池上","唐·白居易",
  ["小娃撑小艇，","偷采白莲回。","不解藏踪迹，","浮萍一道开。"],
  "小孩偷偷划着小船去采白莲花，不知道要藏好，水面的浮萍被划开了一道印子。",
  ["xiǎo wá chēng xiǎo tǐng，","tōu cǎi bái lián huí。","bù jiě cáng zōng jì，","fú píng yī dào kāi。"], 1],
 ["小池","宋·杨万里",
  ["泉眼无声惜细流，","树阴照水爱晴柔。","小荷才露尖尖角，","早有蜻蜓立上头。"],
  "泉水静静地流，树影映在水面上。小荷叶刚冒出尖尖的角，蜻蜓就已经停在上面了。",
  ["quán yǎn wú shēng xī xì liú，","shù yīn zhào shuǐ ài qíng róu。","xiǎo hé cái lù jiān jiān jiǎo，","zǎo yǒu qīng tíng lì shàng tóu。"], 1],
 ["风","唐·李峤",
  ["解落三秋叶，","能开二月花。","过江千尺浪，","入竹万竿斜。"],
  "风能吹落秋天的叶子，也能吹开二月的花。刮过江面掀起大浪，吹进竹林让竹子都弯了腰。",
  ["jiě luò sān qiū yè，","néng kāi èr yuè huā。","guò jiāng qiān chǐ làng，","rù zhú wàn gān xié。"], 1],
 ["画","唐·王维",
  ["远看山有色，","近听水无声。","春去花还在，","人来鸟不惊。"],
  "远远看去山有颜色，走近听水却没有声音。春天过了花还在，人走过来鸟也不飞走——原来是一幅画！",
  ["yuǎn kàn shān yǒu sè，","jìn tīng shuǐ wú shēng。","chūn qù huā hái zài，","rén lái niǎo bù jīng。"], 1],
 ["村居","清·高鼎",
  ["草长莺飞二月天，","拂堤杨柳醉春烟。","儿童散学归来早，","忙趁东风放纸鸢。"],
  "二月里草长得高，黄莺飞来飞去。孩子们放学回来得早，赶紧趁着风放风筝。",
  ["cǎo zhǎng yīng fēi èr yuè tiān，","fú dī yáng liǔ zuì chūn yān。","ér tóng sàn xué guī lái zǎo，","máng chèn dōng fēng fàng zhǐ yuān。"], 2],
 ["望庐山瀑布","唐·李白",
  ["日照香炉生紫烟，","遥看瀑布挂前川。","飞流直下三千尺，","疑是银河落九天。"],
  "太阳照着香炉峰冒出紫色的雾气，远远看见瀑布像挂在山前。水从高处冲下来，好像银河从天上掉下来了。",
  ["rì zhào xiāng lú shēng zǐ yān，","yáo kàn pù bù guà qián chuān。","fēi liú zhí xià sān qiān chǐ，","yí shì yín hé luò jiǔ tiān。"], 2],
 ["赠汪伦","唐·李白",
  ["李白乘舟将欲行，","忽闻岸上踏歌声。","桃花潭水深千尺，","不及汪伦送我情。"],
  "李白正要坐船离开，忽然听到岸上传来踏着节拍的歌声。桃花潭的水再深，也比不上汪伦送别的情谊。",
  ["lǐ bái chéng zhōu jiāng yù xíng，","hū wén àn shàng tà gē shēng。","táo huā tán shuǐ shēn qiān chǐ，","bù jí wāng lún sòng wǒ qíng。"], 2],
 ["草","唐·白居易",
  ["离离原上草，","一岁一枯荣。","野火烧不尽，","春风吹又生。"],
  "原野上的草长得茂盛，一年枯萎一次又绿一次。野火怎么烧也烧不完，春风一吹又长出来了。",
  ["lí lí yuán shàng cǎo，","yī suì yī kū róng。","yě huǒ shāo bù jìn，","chūn fēng chuī yòu shēng。"], 2],
 ["宿新市徐公店","宋·杨万里",
  ["篱落疏疏一径深，","树头新绿未成阴。","儿童急走追黄蝶，","飞入菜花无处寻。"],
  "篱笆稀稀疏疏，小路伸向远处。树梢刚冒新芽还没成荫。小孩子追着黄蝴蝶跑，蝴蝶飞进油菜花里怎么也找不到了。",
  ["lí luò shū shū yī jìng shēn，","shù tóu xīn lǜ wèi chéng yīn。","ér tóng jí zǒu zhuī huáng dié，","fēi rù cài huā wú chù xún。"], 2],
 ["绝句","唐·杜甫",
  ["两个黄鹂鸣翠柳，","一行白鹭上青天。","窗含西岭千秋雪，","门泊东吴万里船。"],
  "两只黄鹂在翠绿的柳树上叫，一行白鹭飞上蓝天。窗外能看见西岭上千年不化的雪，门前停着远航万里来的船。",
  ["liǎng gè huáng lí míng cuì liǔ，","yī háng bái lù shàng qīng tiān。","chuāng hán xī lǐng qiān qiū xuě，","mén bó dōng wú wàn lǐ chuán。"], 2],
 ["晓出净慈寺送林子方","宋·杨万里",
  ["毕竟西湖六月中，","风光不与四时同。","接天莲叶无穷碧，","映日荷花别样红。"],
  "西湖六月的风景和其他时候都不一样。荷叶连着天边一片无穷的碧绿，荷花在太阳下红得特别美丽。",
  ["bì jìng xī hú liù yuè zhōng，","fēng guāng bù yǔ sì shí tóng。","jiē tiān lián yè wú qióng bì，","yìng rì hé huā bié yàng hóng。"], 2],
 ["敕勒歌","北朝民歌",
  ["敕勒川，阴山下。","天似穹庐，笼盖四野。","天苍苍，野茫茫，","风吹草低见牛羊。"],
  "敕勒川在阴山脚下，天像一个巨大的圆顶帐篷笼罩着大地。天蓝蓝的，草原一望无边，风吹过来草低下去，才看到成群的牛羊。",
  ["chì lè chuān，yīn shān xià。","tiān sì qióng lú，lǒng gài sì yě。","tiān cāng cāng，yě máng máng，","fēng chuī cǎo dī xiàn niú yáng。"], 2],
 ["早发白帝城","唐·李白",
  ["朝辞白帝彩云间，","千里江陵一日还。","两岸猿声啼不住，","轻舟已过万重山。"],
  "早上从彩云中的白帝城出发，一天就到了千里外的江陵。两岸猿猴一直在叫，小船已经穿过了一座座大山。",
  ["zhāo cí bái dì cǎi yún jiān，","qiān lǐ jiāng líng yī rì huán。","liǎng àn yuán shēng tí bù zhù，","qīng zhōu yǐ guò wàn chóng shān。"], 3],
 ["望天门山","唐·李白",
  ["天门中断楚江开，","碧水东流至此回。","两岸青山相对出，","孤帆一片日边来。"],
  "天门山被楚江从中间劈开，碧绿的江水东流到这里又折回去。两岸青山面对面站着，一只小船从太阳那边远远驶来。",
  ["tiān mén zhōng duàn chǔ jiāng kāi，","bì shuǐ dōng liú zhì cǐ huí。","liǎng àn qīng shān xiāng duì chū，","gū fān yī piàn rì biān lái。"], 3],
 ["饮湖上初晴后雨","宋·苏轼",
  ["水光潋滟晴方好，","山色空蒙雨亦奇。","欲把西湖比西子，","淡妆浓抹总相宜。"],
  "晴天西湖波光粼粼很美，雨天山色朦胧也很奇妙。如果把西湖比作西施，不管淡妆还是浓妆都一样好看。",
  ["shuǐ guāng liàn yàn qíng fāng hǎo，","shān sè kōng méng yǔ yì qí。","yù bǎ xī hú bǐ xī zǐ，","dàn zhuāng nóng mǒ zǒng xiāng yí。"], 3],
 ["望洞庭","唐·刘禹锡",
  ["湖光秋月两相和，","潭面无风镜未磨。","遥望洞庭山水翠，","白银盘里一青螺。"],
  "秋夜湖光和月色交融在一起，湖面没有风像一面没磨过的镜子。远远望去洞庭湖的青山绿水，就像白银盘里放着一枚青螺。",
  ["hú guāng qiū yuè liǎng xiāng hé，","tán miàn wú fēng jìng wèi mó。","yáo wàng dòng tíng shān shuǐ cuì，","bái yín pán lǐ yī qīng luó。"], 3],
 ["山行","唐·杜牧",
  ["远上寒山石径斜，","白云生处有人家。","停车坐爱枫林晚，","霜叶红于二月花。"],
  "弯弯的石子路通向远处寒冷的山，白云飘出来的地方竟然住着人家。停下车因为太喜欢傍晚的枫林，霜打过的枫叶比二月的花还要红。",
  ["yuǎn shàng hán shān shí jìng xié，","bái yún shēng chù yǒu rén jiā。","tíng chē zuò ài fēng lín wǎn，","shuāng yè hóng yú èr yuè huā。"], 3],
 ["赠刘景文","宋·苏轼",
  ["荷尽已无擎雨盖，","菊残犹有傲霜枝。","一年好景君须记，","最是橙黄橘绿时。"],
  "荷花枯了，举着雨伞般的叶子都没了。菊花虽败，还有枝条傲然立着。一年最好的时候你要记住，就是橙子黄了橘子还绿的时候。",
  ["hé jìn yǐ wú qíng yǔ gài，","jú cán yóu yǒu ào shuāng zhī。","yī nián hǎo jǐng jūn xū jì，","zuì shì chéng huáng jú lǜ shí。"], 3],
 ["夜书所见","宋·叶绍翁",
  ["萧萧梧叶送寒声，","江上秋风动客情。","知有儿童挑促织，","夜深篱落一灯明。"],
  "梧桐叶子沙沙响送来寒意，江上的秋风牵动了游子的心。猜想一定有小孩在捉蟋蟀，半夜了篱笆边还亮着一盏灯。",
  ["xiāo xiāo wú yè sòng hán shēng，","jiāng shàng qiū fēng dòng kè qíng。","zhī yǒu ér tóng tiāo cù zhī，","yè shēn lí luò yī dēng míng。"], 3],
 ["九月九日忆山东兄弟","唐·王维",
  ["独在异乡为异客，","每逢佳节倍思亲。","遥知兄弟登高处，","遍插茱萸少一人。"],
  "一个人在外地做客，每到节日就格外想念亲人。远远知道兄弟们今天又去爬山了，每个人身上都插着茱萸，唯独少了我。",
  ["dú zài yì xiāng wéi yì kè，","měi féng jiā jié bèi sī qīn。","yáo zhī xiōng dì dēng gāo chù，","biàn chā zhū yú shǎo yī rén。"], 3],
 ["题西林壁","宋·苏轼",
  ["横看成岭侧成峰，","远近高低各不同。","不识庐山真面目，","只缘身在此山中。"],
  "横着看是山岭，侧着看是山峰，远近高低每个角度看都不一样。看不清庐山的真面目，只因为自己就站在山里面。",
  ["héng kàn chéng lǐng cè chéng fēng，","yuǎn jìn gāo dī gè bù tóng。","bù shí lú shān zhēn miàn mù，","zhǐ yuán shēn zài cǐ shān zhōng。"], 4],
 ["游山西村","宋·陆游",
  ["莫笑农家腊酒浑，","丰年留客足鸡豚。","山重水复疑无路，","柳暗花明又一村。"],
  "别笑话农家的腊酒浑浊，丰收年他们留着客人吃鸡吃肉。山路重重水路弯弯好像没路了，转过柳荫花丛又出现一个村庄。",
  ["mò xiào nóng jiā là jiǔ hún，","fēng nián liú kè zú jī tún。","shān chóng shuǐ fù yí wú lù，","liǔ àn huā míng yòu yī cūn。"], 4],
 ["黄鹤楼送孟浩然之广陵","唐·李白",
  ["故人西辞黄鹤楼，","烟花三月下扬州。","孤帆远影碧空尽，","唯见长江天际流。"],
  "老朋友在西边的黄鹤楼向我告别，烟花烂漫的三月去扬州。小船越走越远消失在蓝天尽头，只剩下长江水在天边流淌。",
  ["gù rén xī cí huáng hè lóu，","yān huā sān yuè xià yáng zhōu。","gū fān yuǎn yǐng bì kōng jìn，","wéi jiàn cháng jiāng tiān jì liú。"], 4],
 ["送元二使安西","唐·王维",
  ["渭城朝雨浥轻尘，","客舍青青柳色新。","劝君更尽一杯酒，","西出阳关无故人。"],
  "渭城早上的小雨打湿了尘土，旅店旁的柳树绿得发亮。劝你再喝完这杯酒吧，往西出了阳关就见不到老朋友了。",
  ["wèi chéng zhāo yǔ yì qīng chén，","kè shè qīng qīng liǔ sè xīn。","quàn jūn gèng jìn yī bēi jiǔ，","xī chū yáng guān wú gù rén。"], 4],
 ["独坐敬亭山","唐·李白",
  ["众鸟高飞尽，","孤云独去闲。","相看两不厌，","只有敬亭山。"],
  "群鸟高高飞走不见了，一片孤云也悠闲地飘走了。互相对看都不觉得厌倦的，只有我和这座敬亭山。",
  ["zhòng niǎo gāo fēi jìn，","gū yún dú qù xián。","xiāng kàn liǎng bù yàn，","zhǐ yǒu jìng tíng shān。"], 4],
 ["四时田园杂兴（其二十五）","宋·范成大",
  ["梅子金黄杏子肥，","麦花雪白菜花稀。","日长篱落无人过，","惟有蜻蜓蛱蝶飞。"],
  "梅子金黄金黄的，杏子长得胖胖的。麦花开得像雪一样白，菜花已经稀疏了。白天很长，篱笆边没有人经过，只有蜻蜓和蝴蝶在飞。",
  ["méi zǐ jīn huáng xìng zǐ féi，","mài huā xuě bái cài huā xī。","rì cháng lí luò wú rén guò，","wéi yǒu qīng tíng jiá dié fēi。"], 4],
 ["清平乐·村居","宋·辛弃疾",
  ["茅檐低小，溪上青青草。","醉里吴音相媚好，白发谁家翁媪？","大儿锄豆溪东，中儿正织鸡笼。","最喜小儿亡赖，溪头卧剥莲蓬。"],
  "茅草屋矮矮小小的，溪边长满了青青的草。醉醺醺地听到柔软好听的南方口音，白头发的老爷爷老奶奶在聊天。大儿子在溪东锄豆，二儿子在编鸡笼。最可爱的是小儿子，躺在溪边剥莲蓬吃。",
  ["máo yán dī xiǎo，xī shàng qīng qīng cǎo。","zuì lǐ wú yīn xiāng mèi hǎo，bái fà shuí jiā wēng ǎo？","dà ér chú dòu xī dōng，zhōng ér zhèng zhī jī lóng。","zuì xǐ xiǎo ér wú lài，xī tóu wò bāo lián péng。"], 4],
 ["芙蓉楼送辛渐","唐·王昌龄",
  ["寒雨连江夜入吴，","平明送客楚山孤。","洛阳亲友如相问，","一片冰心在玉壶。"],
  "冷雨连着江面，夜里来到吴地。天刚亮送走朋友，楚山显得孤零零的。洛阳的亲友如果问起我，就说我的心像玉壶里的冰一样晶莹透亮。",
  ["hán yǔ lián jiāng yè rù wú，","píng míng sòng kè chǔ shān gū。","luò yáng qīn yǒu rú xiāng wèn，","yī piàn bīng xīn zài yù hú。"], 4],
 ["塞下曲","唐·卢纶",
  ["月黑雁飞高，","单于夜遁逃。","欲将轻骑逐，","大雪满弓刀。"],
  "月黑夜大雁惊飞，匈奴首领趁夜逃跑了。正要带着轻骑兵去追赶，大雪已经落满了弓箭和刀。",

/* 词典真人发音（有道公开接口，免费，无需 Key） */
function dictAudioUrl(text, isEn, force){
  const t = String(text).trim();
  if(!force && (!TTS.dictAudio || !TTS.dictAudio[isEn ? 'en' : 'zh'])) return null;
  if(isEn){
    if(!/^[A-Za-z][A-Za-z'-]{0,18}$/.test(t)) return null;
    return 'https://dict.youdao.com/dictvoice?type=2&audio=' + encodeURIComponent(t);
  }
  if(!/^[\u4e00-\u9fa5]{1,3}$/.test(t)) return null;
  return 'https://dict.youdao.com/dictvoice?le=zh&audio=' + encodeURIComponent(t);
}

function stopSpeak(){
  if(TTS.cur){ try{ TTS.cur.pause(); TTS.cur.currentTime = 0; }catch(e){} TTS.cur = null; }
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  TTS.busy = false;
}

function playUrl(url, cacheKey, onEnd){
  const a = new Audio(url);
  TTS.cur = a;
  a.onended = a.onerror = () => { TTS.cur = null; TTS.busy = false; if(onEnd) onEnd(); };
  a.volume = 1.0;
  a.play().catch(()=>{ TTS.busy = false; });
  if(cacheKey) TTS.cache.set(cacheKey, url);
}

/* ElevenLabs（英文） */
function ttsEleven(text, key, next){
  if(!TTS.elevenKey || typeof fetch === 'undefined'){ next(); return; }
  let t = String(text).trim();
  if(/^[A-Za-z][A-Za-z'-]*$/.test(t)) t = t + '.';
  try{
  fetch((TTS.elevenBase||'https://api.elevenlabs.io')+'/v1/text-to-speech/'+TTS.elevenVoice+'/stream?output_format=mp3_44100_128',{
    method:'POST',
    headers:{'xi-api-key':TTS.elevenKey,'Content-Type':'application/json','Accept':'audio/mpeg'},
    body:JSON.stringify({text: t, model_id: TTS.elevenModel,
      voice_settings:{stability:.45, similarity_boost:.85, style:.10, use_speaker_boost:true}})
  })
  .then(r => {
    if(!r.ok){
      const hint = r.status===401 ? 'Key 无效或已停用'
                 : r.status===429 ? '额度用完或频率超限'
                 : r.status===422 ? '音色 ID 或模型名不对' : '';
      throw new Error('ElevenLabs '+r.status+(hint?'（'+hint+'）':''));
    }
    return r.blob();
  })
  .then(b => { TTS._elevenFail = 0; playUrl(URL.createObjectURL(b), key); })
  .catch(e => {
    const netFail = /Failed to fetch|NetworkError|load failed/i.test(e.message);
    TTS._elevenFail = (TTS._elevenFail || 0) + 1;
    if(netFail && TTS._elevenFail >= (TTS.elevenMaxFail||2) && !TTS._elevenDown){
      TTS._elevenDown = true;
      console.warn('[英文语音] ElevenLabs 连续连不上，本次会话不再重试。');
    }else{
      console.warn('[英文语音] '+e.message+' → 已降级');
    }
    next();
  });
  }catch(e){ console.warn('ElevenLabs 异常:', e.message); next(); }
}

/* 火山引擎豆包（中文） */
function ttsDoubao(text, key, next, onEnd){
  if(!TTS.doubaoKey || typeof fetch === 'undefined'){ next(); return; }
  try{
    fetch(TTS.doubaoProxy, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        user: {uid: 'study-island'},
        req_params: {
          text: text,
          speaker: TTS.doubaoVoice,
          loudness_ratio: 2.0,
          audio_params: {format: 'mp3', sample_rate: 24000}
        }
      })
    })
    .then(r => {
      if(!r.ok){
        return r.json().then(j => { throw new Error('豆包 '+r.status+': '+(j.message||j.error||JSON.stringify(j))); })
               .catch(e => { if(e.message.startsWith('豆包')) throw e; throw new Error('豆包 '+r.status); });
      }
      return r.text();
    })
    .then(text => {
      /* 收集所有音频块（长文本会分多个块返回） */
      let audioB64 = '';
      const lines = text.split('\n');
      for(const line of lines){
        let jsonStr = line;
        if(line.startsWith('data:')) jsonStr = line.replace(/^data:\s*/, '');
        try{
          const d = JSON.parse(jsonStr);
          if(d.code === 0 && d.data) audioB64 += d.data;
        }catch(e){}
      }
      if(!audioB64) throw new Error('豆包: 未收到音频数据');
      const raw = atob(audioB64);
      const bytes = new Uint8Array(raw.length);
      for(let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      TTS._dbFail = 0;
      playUrl(URL.createObjectURL(new Blob([bytes], {type:'audio/mpeg'})), key, onEnd);
    })
    .catch(e => { TTS._dbFail = (TTS._dbFail||0) + 1; console.warn('豆包TTS:', e.message); next(); });
  }catch(e){ TTS._dbFail = (TTS._dbFail||0) + 1; console.warn('豆包TTS 异常:', e.message); next(); }
}

/* 浏览器合成（最后兜底） */
function ttsBrowser(text, isEn){
  TTS.busy = false;
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang  = isEn ? 'en-US' : 'zh-CN';
    u.rate  = isEn ? 0.82 : 0.75;
    u.pitch = 1.05;
    const voices = _voicesCache.length ? _voicesCache : speechSynthesis.getVoices();
    const prefs = isEn
      ? ['Samantha','Microsoft Jenny','Google US English','Karen','en-US','en']
      : ['Microsoft Xiaoxiao','Ting-Ting','Mei-Jia','Google 普通话','zh-CN','zh'];
    for(const p of prefs){
      const v = voices.find(vv => vv.name.includes(p) || vv.lang === p);
      if(v){ u.voice = v; break; }
    }
    speechSynthesis.speak(u);
  }catch(e){}
}

/* 词典真人发音（单字/单词优先） */
function ttsDict(text, isEn, key, next, force){
  const url = dictAudioUrl(text, isEn, force);
  if(!url){ next(); return; }
  const a = new Audio(url);
  let done = false;
  const fail = () => { if(done) return; done = true; TTS.cur = null; next(); };
  const kill = setTimeout(fail, 3500);
  a.oncanplaythrough = () => { clearTimeout(kill); };
  a.onended = () => { done = true; TTS.cur = null; TTS.busy = false; };
  a.onerror = fail;
  TTS.cur = a;
  a.play().then(()=>{ done = true; clearTimeout(kill); TTS.cache.set(key, url); })
    .catch(()=>{ clearTimeout(kill); next(); });
}

/* 主入口：词典 → 豆包/ElevenLabs → 浏览器兜底 */
function speak(text, lang){
  if(!text || !String(text).trim()) return;
  const isEn = String(lang||'zh-CN').startsWith('en');
  const key  = (isEn?'en|':'zh|') + text;
  stopSpeak();

  if(TTS.cache.has(key)){ playUrl(TTS.cache.get(key), null); return; }
  TTS.busy = true;

  const toBrowser = () => ttsBrowser(text, isEn);
  if(isEn){ ttsEleven(text, key, toBrowser); return; }
  if(TTS._dbFail >= 5){ toBrowser(); return; }
  ttsDoubao(text, key, toBrowser);
}

/* 读汉字：带上组词做语境 */
function speakHanzi(ch, term){
  if(!TTS.readContext || !term){ speak(ch, 'zh-CN'); return; }
  const w = String(term).split(/[\s，,]+/).filter(Boolean)[0];
  if(!w || w === ch || w.indexOf(ch) < 0){ speak(ch, 'zh-CN'); return; }
  speak(ch + '。' + w + '的' + ch + '。', 'zh-CN');
}

function speakFast(text, lang){ speak(text, lang); }

/* ══════════════════════════════════════════════════════════════
   古诗朗读：豆包 → 浏览器兜底，一句一句读
   ══════════════════════════════════════════════════════════════ */
function speakPoemLine(line, done){
  const key = 'poem|' + line;
  const guardMs = 900 + String(line).length * 380;
  let fired = false;
  const finish = () => { if(fired) return; fired = true; done && done(); };
  const guard = setTimeout(finish, guardMs + 2500);
  const end = () => { clearTimeout(guard); finish(); };

  if(TTS.cache.has(key)){ playUrl(TTS.cache.get(key), null, end); return; }
  const fallback = () => {
    ttsBrowser(String(line), false);
    setTimeout(end, guardMs);
  };
  ttsDoubao(line, key, fallback, end);
}

var reciting = false, reciteTimer = null;
function stopRecite(){
  reciting = false;
  clearTimeout(reciteTimer);
  stopSpeak();
  document.querySelectorAll('.pline').forEach(el => el.classList.remove('on'));
  const b = document.getElementById('reciteBtn');
  if(b) b.innerHTML = '<span class="e">🔊</span>朗诵这首诗';
}
function recitePoem(){
  if(reciting){ stopRecite(); return; }
  const gradePoems = POEMS.filter(p => (p[5]||1) === poemGrade);
  const poem = gradePoems[poemIdx];
  const title = poem[0], author = poem[1], lines = poem[2];
  reciting = true;
  const b = document.getElementById('reciteBtn');
  if(b) b.innerHTML = '<span class="e">⏸</span>停止';
  let i = 0;
  const readLines = () => {
    if(!reciting) return;
    if(i >= lines.length){ stopRecite(); return; }
    document.querySelectorAll('.pline').forEach(el => el.classList.remove('on'));
    const cur = document.querySelector('.pline[data-i="'+i+'"]');
    if(cur) cur.classList.add('on');
    speakPoemLine(lines[i], () => {
      i++;
      reciteTimer = setTimeout(readLines, 420);
    });
  };
  // 标题读完 → 作者读完 → 逐行读诗句
  speakPoemLine(title, () => {
    if(!reciting) return;
    speakPoemLine(author, () => {
      if(!reciting) return;
      reciteTimer = setTimeout(readLines, 500);
    });
  });
}

/* ══════════ 惩罚机制：断卡 → 受攻击 → 死亡 ══════════ */
let penaltyMsg = "";
function applyPenalty(){
  penaltyMsg = "";
  if(S.dead || !S.lastCheck) return;
  const gap = dayGap(S.lastCheck, today());
  // 水分自然消耗
  S.water = Math.max(0, 100 - gap * CFG.waterDecay);
  if(gap >= CFG.deadDay){
    S.dead = true; S.hp = 0;
    penaltyMsg = `已经 ${gap} 天没有打卡，小兔兔没能撑住…`;
  }else if(gap >= CFG.warnDay){
    const dmg = (gap - CFG.warnDay + 1) * CFG.hurtPerDay;
    S.hp = Math.max(1, 100 - dmg);
    penaltyMsg = `${gap} 天没打卡了！小兔兔正在生病，体力只剩 ${S.hp}。快去学习救它！`;
  }
}

function checkin(){
  if(S.lastCheck === today()){ toast("今天已经打过卡啦 ✅"); return; }
  if(S.dead){ toast("小兔兔已经不在了，先复活它吧"); return; }
  const gap = S.lastCheck ? dayGap(S.lastCheck, today()) : 99;
  S.streak = gap === 1 ? S.streak + 1 : 1;
  S.lastCheck = today(); S.totalDays++;
  S.hp = Math.min(100, S.hp + CFG.checkinHp);
  S.water = Math.min(100, S.water + 10);
  const bonus = Math.min(S.streak, 7);

  petReact('happy');
  modal(`<div class="e">📋</div><h3>打卡成功！</h3>

function rabbitSrc(f){ return RABBIT_CFG.videoDir + encodeURIComponent(f); }
function rabbitLvIdx(){
  let i=0; RABBIT_CFG.levels.forEach((l,n)=>{ if(S.rabbit.growth>=l.need) i=n; }); return i;
}
function rabbitSay(text){
  const bub = $("rbubble"); if(bub) bub.textContent = text;
  if(!S.rabbit.voice || !("speechSynthesis" in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang="zh-CN"; u.rate=.95; u.pitch=1.25; speechSynthesis.speak(u);
  }catch(e){}
}
function rabbitPlay(file, line){
  const v=$("rvideo"), sc=$("rscreen");
  if(!v||!sc) return;
  v.src = rabbitSrc(file); v.loop = false;
  sc.classList.add("playing");
  v.play().catch(()=>{ v.muted=true; v.play().catch(()=>{}); });
  sc.classList.add("pop"); setTimeout(()=>sc.classList.remove("pop"),260);
  if(line) rabbitSay(line);
}
function rabbitPoke(){
  const sc=$("rscreen"); if(sc){ sc.classList.add("pop"); setTimeout(()=>sc.classList.remove("pop"),260); }
}
function rabbitAddCoin(n, quiet){
  const before = rabbitLvIdx();
  S.rabbit.coin = Math.max(0, S.rabbit.coin+n);
  if(n>0) S.rabbit.growth += n;
  save(); rabbitRender();
  if(!quiet && n>0){ const t=RABBIT_CFG.lines.earn; rabbitSay(t[Math.floor(Math.random()*t.length)].replace("{n}",n)); }
  return before;
}
function rabbitCheckLvUp(before){
  const now = rabbitLvIdx();
  if(now>before) setTimeout(()=>rabbitSay(RABBIT_CFG.lines.levelUp.replace("{name}",RABBIT_CFG.levels[now].name)),900);
}
// 模块→兔兔任务的映射
const _moduleToTask = {hz:"learn_hz", py:"learn_py", math:"learn_math", en:"learn_en", poem:"learn_poem", think:"learn_think"};
function rabbitAutoCheck(key){
  const tid = _moduleToTask[key];
  if(!tid || S.rabbit.done.includes(tid)) return;
  const t = RABBIT_CFG.tasks.learn.find(x=>x.id===tid);
  if(!t) return;
  // 每日上限检查
  const earnedToday = RABBIT_CFG.tasks.learn.filter(x=>S.rabbit.done.includes(x.id)).reduce((s,x)=>s+x.coin,0)
    + RABBIT_CFG.tasks.habit.filter(x=>S.rabbit.done.includes(x.id)).reduce((s,x)=>s+x.coin,0);
  if(earnedToday + t.coin > 16) return;
  S.rabbit.done.push(tid);
  const first = !S.rabbit.counted;
  if(first){
    const gap = S.rabbit.lastDay ? dayGap(S.rabbit.lastDay, S.rabbit.day) : 99;
    S.rabbit.prevLastDay = S.rabbit.lastDay;
    S.rabbit.streak = (gap===1) ? S.rabbit.streak+1 : 1;
    S.rabbit.lastDay = S.rabbit.day;
    S.rabbit.counted = true;
  }
  const before = rabbitLvIdx();
  rabbitAddCoin(t.coin);
  rabbitCheckLvUp(before);
  // 连续打卡奖励
  let bonus=0, why="";
  if(first && S.rabbit.streak>S.rabbit.bonusAt){
    if(S.rabbit.streak%3===0){ bonus+=RABBIT_CFG.bonus.streak3; why="连续 "+S.rabbit.streak+" 天"; }
    if(S.rabbit.streak===7){ bonus+=RABBIT_CFG.bonus.streak7; why="一周全勤"; }
    if(bonus) S.rabbit.bonusAt=S.rabbit.streak;
  }
  if(bonus){
    setTimeout(()=>{ rabbitAddCoin(bonus,true); rabbitSay(why+"，额外奖励 "+bonus+" 个胡萝卜币！"); },1400);
  }
  if(cur!=="home") toast("在「"+t.name+"」中完成了学习，+"+t.coin+" 🥕");
}
function rabbitAllTasks(){ return [...RABBIT_CFG.tasks.learn, ...RABBIT_CFG.tasks.habit]; }

function rabbitToggleTask(t){
  const i = S.rabbit.done.indexOf(t.id);
  if(i>=0){
    S.rabbit.done.splice(i,1);
    S.rabbit.coin = Math.max(0, S.rabbit.coin-t.coin);
    S.rabbit.growth = Math.max(0, S.rabbit.growth-t.coin);
    if(!S.rabbit.done.length && S.rabbit.counted){
      S.rabbit.streak = Math.max(0, S.rabbit.streak-1);
      S.rabbit.lastDay = S.rabbit.prevLastDay || null;
      if(S.rabbit.bonusAt>S.rabbit.streak) S.rabbit.bonusAt=S.rabbit.streak;
      S.rabbit.counted=false;
    }
    save(); rabbitRender(); rabbitSay(RABBIT_CFG.lines.undo[0]); return;
  }
  S.rabbit.done.push(t.id);
  const first = !S.rabbit.counted;
  if(first){
    const gap = S.rabbit.lastDay ? dayGap(S.rabbit.lastDay, S.rabbit.day) : 99;
    S.rabbit.prevLastDay = S.rabbit.lastDay;
    S.rabbit.streak = (gap===1) ? S.rabbit.streak+1 : 1;
    S.rabbit.lastDay = S.rabbit.day;
    S.rabbit.counted = true;
  }
  const before = rabbitAddCoin(t.coin);
  let bonus=0, why="";
  if(first && S.rabbit.streak>S.rabbit.bonusAt){
    if(S.rabbit.streak%3===0){ bonus+=RABBIT_CFG.bonus.streak3; why="连续 "+S.rabbit.streak+" 天"; }
    if(S.rabbit.streak===7){ bonus+=RABBIT_CFG.bonus.streak7; why="一周全勤"; }
    if(bonus) S.rabbit.bonusAt=S.rabbit.streak;
  }
  if(bonus){
    setTimeout(()=>{ rabbitAddCoin(bonus,true); rabbitSay(why+"，额外奖励 "+bonus+" 个胡萝卜币！"); rabbitCheckLvUp(before); },1400);
  }else{
    rabbitCheckLvUp(before);
    if(S.rabbit.done.length===rabbitAllTasks().length) setTimeout(()=>rabbitSay(RABBIT_CFG.lines.dayClear),1200);
  }
}

function rabbitBuy(item){
  if(S.rabbit.owned.includes(item.id)){ rabbitPlay(item.file, item.line); return; }
  const lv = rabbitLvIdx()+1;
  if(lv<item.level){ rabbitSay(RABBIT_CFG.lines.locked.replace("{name}",RABBIT_CFG.levels[item.level-1].name)); return; }
  if(S.rabbit.coin<item.price){ rabbitSay(RABBIT_CFG.lines.notEnough.replace("{n}",item.price-S.rabbit.coin)); return; }
  if(!confirm("用 "+item.price+" 个胡萝卜币换「"+item.name+"」吗？\n（换完还剩 "+(S.rabbit.coin-item.price)+" 个）")) return;
  S.rabbit.coin -= item.price;
  S.rabbit.owned.push(item.id);
  save(); rabbitRender();
  rabbitPlay(item.file, RABBIT_CFG.lines.unlock.replace("{n}",String(S.rabbit.owned.length)));
  if(S.rabbit.owned.length===RABBIT_CFG.shop.length) setTimeout(()=>rabbitSay(RABBIT_CFG.lines.allDone),5200);
}

      <path d="M22,9 C18,16 18,28 22,35 L156,25.5 C162,24 162,20 156,18.5 Z" fill="none" stroke="#c85c18" stroke-width="2.5"/>
     </svg>
     <div class="rlv"><b>Lv.${lv} ${curLv.name}</b><span>${nextLv?"再 "+(nextLv.need-R.growth)+" 成长值 → "+nextLv.name:"成长值 "+R.growth+" · 满级"}</span></div>
    </div>
    <div class="rpurse" id="rpurse" title="长按 1.5 秒进入家长模式">
     <span aria-hidden="true">🥕</span><span class="rn">${R.coin}</span><span>胡萝卜币</span>

    <section class="rpanel">
     <div class="rscreen" id="rscreen">
      <img class="ridle" id="ridleImg" src="${rabbitSrc(RABBIT_CFG.idlePoster)}" alt="小白兔在窝里休息" onerror="this.style.display='none'">

var petIdle = {blink:null, act:null};
function petLifeStart(){
  clearTimeout(petIdle.blink); clearTimeout(petIdle.act);
  const blink = () => {
    const eyes = document.querySelector('.rb .rb-eyes');
    if(eyes && !document.hidden){
      eyes.classList.add('blinking');
      setTimeout(()=>eyes.classList.remove('blinking'), 170);
      // 偶尔连眨两下，比匀速眨眼自然
      if(Math.random() < .28) setTimeout(()=>{
        eyes.classList.add('blinking'); setTimeout(()=>eyes.classList.remove('blinking'),150);
      }, 320);
    }
    petIdle.blink = setTimeout(blink, 2200 + Math.random()*4600);
  };
  const idleAct = () => {
    if(!document.hidden && Math.random() < .65){
      petReact(Math.random() < .5 ? 'tilt' : 'yawn', true);
    }
    petIdle.act = setTimeout(idleAct, 7000 + Math.random()*9000);
  };
  petIdle.blink = setTimeout(blink, 1200);
  petIdle.act   = setTimeout(idleAct, 6000);
}

/* ══════ 反应：孩子做什么，它就有什么动作 ══════ */
function petReact(kind, silent){
  const el = document.querySelector('.rb');
  if(!el) return;
  const map = {tap:'act-tilt', tilt:'act-tilt', happy:'act-hop', eat:'act-eat', yawn:'act-yawn'};
  const cls = map[kind]; if(!cls) return;
  Object.values(map).forEach(c => el.classList.remove(c));
  void el.getBoundingClientRect();          // 强制重排，让同一个动画能连续触发
  el.classList.add(cls);
  const dur = kind === 'eat' ? 1600 : kind === 'yawn' ? 1500 : 900;
  setTimeout(() => el.classList.remove(cls), dur);
  if(silent) return;
  if(kind === 'eat')   { petBurst('🥕'); sfx('chew'); }
  if(kind === 'happy') { petBurst('💗'); sfx('yay'); }
  if(kind === 'tap')   { sfx('pop'); }
}

/* 粒子：从兔子身上飘出来的小东西 */
function petBurst(ch){
  const el = document.querySelector('.rb');
  if(!el) return;
  const r = el.getBoundingClientRect();
  for(let i=0;i<6;i++){
    const d = document.createElement('div');
    d.className = 'petp';
    d.textContent = ch;
    d.style.left = (r.left + r.width*(0.2 + Math.random()*0.6)) + 'px';
    d.style.top  = (r.top  + r.height*(0.25 + Math.random()*0.3)) + 'px';
    d.style.setProperty('--dx', (Math.random()*80 - 40) + 'px');
    d.style.animationDelay = (i*55) + 'ms';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 1400);
  }
}

/* ══════ 音效：用 Web Audio 现场合成，不需要任何音频文件 ══════ */
var SFX = {ctx:null, on:true};
function sfx(kind){
  if(!SFX.on) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    SFX.ctx = SFX.ctx || new AC();
    const c = SFX.ctx; if(c.state === 'suspended') c.resume();
    const t = c.currentTime;
    const tone = (freq, start, dur, type, vol) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t+start);
      g.gain.setValueAtTime(0, t+start);
      g.gain.linearRampToValueAtTime(vol || .18, t+start+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t+start+dur);
      o.connect(g); g.connect(c.destination);
      o.start(t+start); o.stop(t+start+dur+0.02);
    };
    if(kind === 'pop'){                       // 点一下：短促上滑
      const o = c.createOscillator(), g = c.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(420, t); o.frequency.exponentialRampToValueAtTime(880, t+0.10);
      g.gain.setValueAtTime(.22, t); g.gain.exponentialRampToValueAtTime(.0001, t+0.16);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+0.18);
    }else if(kind === 'yay'){                 // 答对/奖励：三音上行
      tone(659,0,.14,'triangle',.16); tone(784,.09,.14,'triangle',.16); tone(1047,.18,.24,'triangle',.18);
    }else if(kind === 'chew'){                // 咀嚼：几下短噪声
      for(let i=0;i<4;i++){
        const b = c.createBuffer(1, 1200, c.sampleRate), d = b.getChannelData(0);
        for(let j=0;j<d.length;j++) d[j] = (Math.random()*2-1) * (1 - j/d.length);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type='bandpass'; f.frequency.value = 700 + Math.random()*500;
        s.buffer = b; g.gain.value = .10;
        s.connect(f); f.connect(g); g.connect(c.destination);
        s.start(t + i*0.19);
      }
    }else if(kind === 'coin'){
      tone(988,0,.10,'square',.10); tone(1319,.07,.18,'square',.10);
    }
  }catch(e){}
}

}

/* ══════════ 数学 ══════════ */
const MODES = [["num","🌱 认数字"],["match","🌿 数与量对应"],["cmp","🍃 比大小"],
  ["split","🌾 分解与合成"],["add10","🌳 10以内加减"],["add20","🌲 20以内加减"],
  ["cts","🧮 凑十法"],["pss","📐 破十法"],["near","⛰️ 相邻数 100内"]];
let mMode = "add10", Q = null, typed = "", judged = "";
const FRUIT = ["🍎","🍊","🍓","🍌","🍇","🐟","🥕","⭐"];

function newQ(){
  typed = ""; judged = "";
  const f = pick(FRUIT);
  if(mMode==="num"){
    const n = 1 + rnd(20);
    Q = {t:"choice", title:"这是数字几？", show:`<div class="expr" style="font-size:96px">${n}</div>`,
         opts:shuffle(uniqNums(n,4)), ans:n, sm:false};
  }else if(mMode==="match"){
    const n = 1 + rnd(10);
    Q = {t:"choice", title:"数一数，一共有几个？", show:`<div class="viz"><div class="dots" style="grid-template-columns:repeat(5,1fr)">${
      Array.from({length:n},()=>`<span>${f}</span>`).join("")}</div></div>`,
      opts:shuffle(uniqNums(n,4)), ans:n};
  }else if(mMode==="cmp"){
    const a = rnd(100), b = Math.random()<.25 ? a : rnd(100);
    Q = {t:"choice", title:"比一比，中间填什么？",
      show:`<div class="expr">${a} <span class="q">?</span> ${b}</div>`,
      opts:["＞","＜","＝"], ans: a>b?"＞":a<b?"＜":"＝", sm:true};
  }else if(mMode==="split"){
    const tot = 3 + rnd(8), a = 1 + rnd(tot-1);
    Q = {t:"pad", title:"分一分，还剩几？",
      show:`<div class="expr">${tot} <span class="op">=</span> ${a} <span class="op">+</span> <span class="q">?</span></div>
        <div class="viz"><div class="dots" style="grid-template-columns:repeat(5,1fr)">${
          Array.from({length:tot},(_,i)=>`<span style="${i<a?"":"opacity:.28"}">${f}</span>`).join("")}</div></div>`,
      ans: tot-a};
  }else if(mMode==="add10" || mMode==="add20"){
    const max = mMode==="add10" ? 10 : 20;
    const plus = Math.random() < .5;
    let a,b,ans;
    if(plus){ a = 1+rnd(max-1); b = 1+rnd(max-a); ans = a+b; }
    else { a = 2+rnd(max-1); b = 1+rnd(a-1); ans = a-b; }
    let viz = "";
    if(max===10){
      viz = plus
        ? `<div class="viz"><div class="dots" style="grid-template-columns:repeat(3,1fr)">${dot(a,f)}</div>
             <div class="lab">加上</div><div class="dots" style="grid-template-columns:repeat(3,1fr)">${dot(b,f)}</div>
             <div class="lab k">一共</div></div>`
        : `<div class="viz"><div class="dots" style="grid-template-columns:repeat(3,1fr)">${dot(a,f)}</div>
             <div class="lab">拿走</div><div class="dots" style="grid-template-columns:repeat(1,1fr)">${dot(b,f)}</div>
             <div class="lab k">还剩</div></div>`;
    }
    Q = {t:"pad", title:(max===10?"10":"20")+"以内加减法",
      show:`<div class="expr">${a} <span class="op">${plus?"+":"-"}</span> ${b} <span class="eq">=</span> <span class="q">?</span></div>${viz}`,
      ans};
  }else if(mMode==="cts"){ // 凑十法
    const big = 7 + rnd(3); // 7, 8, 9 三个凑十数
    const small = 2 + rnd(7); // 2-8
    const split = 10 - big; // 大数需要几来凑十
    const remain = small - split; // 小数分完后剩多少
    const ans = big + small;
    Q = {t:"pad", title:"凑十法：看大数，分小数，凑成十，加剩数",
      show:`<div class="expr">${big} <span class="op">+</span> ${small} <span class="eq">=</span> <span class="q">?</span></div>
        <div class="story" style="text-align:left"><span>💡</span><div>
          <b>凑十法口诀：</b><br>
          ① 看大数 <b>${big}</b>，还差 <b>${split}</b> 就凑成 10<br>
          ② 分小数 <b>${small}</b> = <b>${split}</b> + <b>${remain}</b><br>
          ③ <b>${big}</b> + <b>${split}</b> = <b>10</b><br>
          ④ <b>10</b> + <b>${remain}</b> = <b>?</b></div></div>`,
      ans};
  }else if(mMode==="pss"){ // 破十法
    const tens = 10 + rnd(8); // 10-18
    const sub = 2 + rnd(8); // 2-9
    if(sub > tens){ Q = {t:"pad", title:"破十法", show:`<div>重新出题</div>`, ans:0}; }
    const ones = tens - 10;
    const remain = 10 - sub;
    const ans = tens - sub;
    Q = {t:"pad", title:"破十法：十几减几，个位不够减，从十位破开",
      show:`<div class="expr">${tens} <span class="op">-</span> ${sub} <span class="eq">=</span> <span class="q">?</span></div>
        <div class="story" style="text-align:left"><span>💡</span><div>
          <b>破十法口诀：</b><br>
          ① <b>${tens}</b> 分成 <b>10</b> 和 <b>${ones}</b><br>
          ② 先用 <b>10</b> - <b>${sub}</b> = <b>${remain}</b><br>
          ③ 再算 <b>${remain}</b> + <b>${ones}</b> = <b>?</b></div></div>`,
      ans};
  }else{ // near
    const n = 1 + rnd(98);
    Q = {t:"pad", title:"它的前面和后面各是几？（先填前面）",
      show:`<div class="expr"><span class="q">?</span> — ${n} — <span style="opacity:.35">?</span></div>`,
      ans:n-1, then:{ans:n+1, tip:"很好！再填后面那个数"}};
  }
}

function uniqNums(ans,k){
  const s = new Set([ans]); let guard = 0;
  while(s.size<k && guard++<60){ s.add(Math.max(0, ans + rnd(11) - 5)); }
  while(s.size<k) s.add(s.size + ans + 1);

}

function memo(i){
  const c = tState.cards[i];

  if(tState.open.length===2){

/* ══════════ 数独 ══════════ */
let SUDOKU_SOLUTION = null;
function generateSudoku4(){
  const N=4, subR=2, subC=2;
  const board = Array.from({length:N},()=>Array(N).fill(0));
  const nums = [1,2,3,4];
  function valid(r,c,v){
    for(let i=0;i<N;i++){ if(board[r][i]===v||board[i][c]===v) return false; }
    const br=Math.floor(r/subR)*subR, bc=Math.floor(c/subC)*subC;
    for(let i=br;i<br+subR;i++) for(let j=bc;j<bc+subC;j++) if(board[i][j]===v) return false;
    return true;
  }
  function solve(){
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      if(board[r][c]===0){
        const cand = shuffle(nums.slice());
        for(let v of cand){ if(valid(r,c,v)){ board[r][c]=v; if(solve()) return true; board[r][c]=0; } }
        return false;
      }
    }
    return true;
  }
  solve();
  return board;
}
function digHoles(board, holes){
  const N=board.length, puzzle=board.map(r=>[...r]);
  const cells=shuffle(Array.from({length:N*N},(_,i)=>i));
  for(let k=0;k<holes&&k<cells.length;k++){
    const r=Math.floor(cells[k]/N), c=cells[k]%N;
    puzzle[r][c]=0;
  }
  return puzzle;
}
function tSudoku(){
  if(!tState){
    SUDOKU_SOLUTION = generateSudoku4();
    tState={puzzle:digHoles(SUDOKU_SOLUTION,8), sel:[], wrong:null};
  }
  const N=tState.puzzle.length;
  let html = `<div class="qhead"><span>填入 1-4，每行每列每个 2×2 宫不重复</span></div>
    <div class="grid5" style="grid-template-columns:repeat(${N},1fr);max-width:${N*68}px;margin:0 auto 14px">`;
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const v=tState.puzzle[r][c];
    const sel= tState.sel[0]===r&&tState.sel[1]===c;
    const isWrong= tState.wrong && tState.wrong[0]===r&&tState.wrong[1]===c;
    html += `<div class="cell" style="font-size:24px;color:${v?"var(--brand)":"var(--ink-soft)"};background:${sel?"#FFF3D0":isWrong?"#FDECEB":""}"
      onclick="sudokuSet(${r},${c})">${v||""}</div>`;
  }
  html += `</div><div class="choices" style="max-width:${N*68}px;margin:0 auto">`;
  for(let n=1;n<=4;n++) html += `<button class="choice sm" onclick="sudokuPut(${n})">${n}</button>`;
  html += `</div><div style="text-align:center;margin-top:12px"><button class="big p" onclick="tState=null;SUDOKU_SOLUTION=null;render()" style="padding:12px 24px;font-size:16px">🔄 换一题</button></div>`;
  $("tbox").innerHTML = html;
}
function sudokuSet(r,c){
  if(tState.puzzle[r][c]) return;
  tState.sel=[r,c]; tState.wrong=null; pgThink();
}
function sudokuPut(n){
  if(!tState.sel.length) return;
  const [r,c]=tState.sel;
  if(SUDOKU_SOLUTION[r][c]===n){
    tState.puzzle[r][c]=n; tState.sel=[]; tState.wrong=null;
    let done=true;

   export default {

       if (request.method === 'OPTIONS') {

           'Access-Control-Allow-Headers': '*',
           'Access-Control-Max-Age': '86400'
         }});
       }

       const resp = await fetch(target, {
         method: request.method,
         headers: request.headers,
         body: ['GET','HEAD'].includes(request.method) ? undefined : request.body
       });

       const h = new Headers(resp.headers);
       h.set('Access-Control-Allow-Origin', '*');
       h.set('Access-Control-Expose-Headers', '*');
       return new Response(resp.body, { status: resp.status, headers: h });

const B_TONE_FIX={"de5":"de","le5":"le","zhe5":"zhe","ge5":"ge","men5":"men","zi5":"zi","li5":"li","ba5":"ba","ma5":"ma","ne5":"ne","a5":"a","la5":"la"};
function bToTone(py){
  if(!py)return'';if(B_TONE_FIX[py])return B_TONE_FIX[py];
  var m=py.match(/^([a-züv]+)([1-4])$/);if(!m)return py;
  var base=m[1],num=parseInt(m[2]),toneMap={'a':['ā','á','ǎ','à'],'e':['ē','é','ě','è'],'i':['ī','í','ǐ','ì'],'o':['ō','ó','ǒ','ò'],'u':['ū','ú','ǔ','ù'],'ü':['ǖ','ǘ','ǚ','ǜ'],'v':['ǖ','ǘ','ǚ','ǜ']};
  var pos=-1;if(/[ae]/.test(base)){pos=base.search(/[ae]/);}else if(/ou/.test(base)){pos=base.indexOf('o');}else{var vowels=base.match(/[iouüv]/g);if(vowels)pos=base.lastIndexOf(vowels[vowels.length-1]);}
  if(pos<0)return py;var v=base[pos];if(!toneMap[v])return py;
  return base.slice(0,pos)+toneMap[v][num-1]+base.slice(pos+1);
}
function bPyDisplay(rawPy){if(!rawPy)return'';return rawPy.split(' ').map(bToTone).join(' ');}

async function bGenImgDoubao(promptZh,bookId,pageIdx){

    var r=await fetch('https://ark.cn-beijing.volces.com/api/v3/images/generations',{method:'POST',headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({model:BOOK_CFG.doubaoModel||'doubao-seedream-5-0-260128',prompt:promptZh,size:BOOK_CFG.imgSize||'768x576',watermark:false,response_format:'url'})});

async function bGenImgSF(promptZh,bookId,pageIdx){
  var key=BOOK_CFG.imgKey||'';if(!key)return null;

    var r=await fetch('https://api.siliconflow.cn/v1/images/generations',{method:'POST',headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({model:BOOK_CFG.imgModel||'Tongyi-MAI/Z-Image-Turbo',prompt:promptZh,image_size:BOOK_CFG.imgSize||'768x576',num_images:1})});

async function bGenerateImg(prompt,promptZh,bookId,pageIdx){
  var ck=bookId+'_'+pageIdx;if(IMG_CACHE[ck])return IMG_CACHE[ck];
  var pollUrl=bPollUrl(prompt,bookId,pageIdx),apiUrl=null;
  try{
    apiUrl=await Promise.race([
      new Promise(function(resolve){var pending=[bGenImgDoubao(promptZh,bookId,pageIdx),bGenImgSF(promptZh,bookId,pageIdx)];pending.forEach(function(p){p.then(function(v){if(!apiUrl&&v){apiUrl=v;resolve(v);}}).catch(function(){});});setTimeout(function(){if(!apiUrl)resolve(null);},10000);})
    ]);

function bRenderZH(text){
  var h='',pm=BOOK_CFG.pinyinMode||'all',fs=BOOK_CFG.fontSize||28;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(/[\u4e00-\u9fff]/.test(c)){
      var entry=B_ZH_DICT[c],rawPy=entry?entry.py:'',py=bPyDisplay(rawPy);
      var pyStyle=pm==='none'?'visibility:hidden':pm==='hover'?'opacity:0;transition:opacity .2s':'';
      h+='<span class="b-char-block" data-c="'+c+'" data-py="'+rawPy+'" onclick="bTapZH(\''+c+'\',event)"><span class="b-py" style="font-size:10px;'+pyStyle+'">'+py+'</span><span class="b-hz" style="font-size:'+fs+'px">'+c+'</span></span>';
    }else if(/[，。！？；：、""''（）《》【】]/.test(c)){
      h+='<span class="b-epunct">'+c+'</span>';
    }else if(c!==' '){
      h+='<span class="b-epunct">'+c+'</span>';
    }
  }

}
function bRenderEN(text){
  var fs=(BOOK_CFG.fontSize||28)*0.75;
  return text.replace(/([.,!?;:])/g,' $1 ').split(/\s+/).filter(Boolean).map(function(tok){
    if(/^[.,!?;:]+$/.test(tok))return'<span class="b-epunct-en">'+tok+'</span> ';
    var k=tok.toLowerCase().replace(/[^a-z']/g,'');
    if(!k)return'<span class="b-epunct-en">'+tok+'</span> ';
    return'<span class="b-eword" data-w="'+k+'" data-disp="'+tok.replace(/"/g,'&quot;')+'" style="font-size:'+fs+'px" onclick="bTapEN(this.dataset.w,this.dataset.disp,event)">'+tok+'</span> ';
  }).join('');
}

    var newBook={id:Date.now(),title:bookTitle,theme:themeName,lang:_genLang,badge:'new',pages:pages};
    setStep(2);BOOKS.unshift(newBook);bSaveBooks();ldEl.style.display='none';$('bBtnGen').disabled=false;bOpenBook(newBook);
  }catch(e){ldEl.style.display='none';$('bBtnGen').disabled=false;toast('生成失败: '+e.message);}
}
function bDeleteBook(id){BOOKS=BOOKS.filter(function(b){return b.id!==id});bSaveBooks();pgBook();}

// ── 绘本馆视图 ──
var bLibFilter='all';
function bSetFilter(f){bLibFilter=f;document.querySelectorAll('#bLibFilter button').forEach(function(b,i){var vals=['all','zh','en'];b.className=(vals[i]===f?'on '+vals[i]:'');});pgBook();}

// ── 主入口 ──
function pgBook(){
  if(!BOOKS.length)bInitData();
  // 根据子视图渲染
  if(bView==='reader'&&curBook){bRenderReader();return;}
  if(bView==='generator'){bRenderGen();return;}
  bView='library';bRenderLib();
}
function bRenderLib(){
  var books=BOOKS.filter(function(b){return bLibFilter==='all'||b.lang===bLibFilter;}),page=$('page');
  var html='<div class="b-lib-header"><h2>📚 我的绘本馆</h2><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><div class="b-filter-row" id="bLibFilter"><button class="on all" onclick="bSetFilter(\'all\')">全部</button><button onclick="bSetFilter(\'zh\')">中文</button><button onclick="bSetFilter(\'en\')">English</button></div><button class="b-btn-gen zh" onclick="bView=\'generator\';pgBook()">✨ 创作新故事</button></div></div>';
  if(!books.length){html+='<p style="text-align:center;color:var(--ink-soft);padding:40px">还没有绘本，快去创作吧！</p>';page.innerHTML=html;return;}
  html+='<div class="b-lib-grid">'+books.map(function(b){var emoji=bThemeEmoji(b.theme),firstImg=IMG_CACHE[b.id+'_0'],imgHTML=firstImg?'<img src="'+firstImg+'" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"><span style="position:relative;font-size:28px;text-shadow:0 2px 8px rgba(0,0,0,.3)">'+emoji+'</span>':'<span style="font-size:48px">'+emoji+'</span>',badge=b.badge==='new'?'<span class="b-badge b-badge-new">NEW</span>':(b.lang==='zh'?'<span class="b-badge b-badge-zh">中</span>':'<span class="b-badge b-badge-en">EN</span>');
    return'<div class="b-lib-card" onclick="bOpenById('+b.id+')"><div class="b-lib-card-img" style="position:relative">'+imgHTML+'</div><div class="b-lib-card-info"><div class="b-lib-card-title '+b.lang+'">'+b.title.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+badge+'</div><div class="b-lib-card-meta">'+b.pages.length+(b.lang==='zh'?'页':'p')+' · '+b.theme+' <span style="cursor:pointer;float:right;color:var(--red);font-size:11px" onclick="event.stopPropagation();bDeleteBook('+b.id+')">🗑</span></div></div></div>';
  }).join('')+'</div>';
  page.innerHTML=html;
}
function bRenderGen(){
  var page=$('page'),isEn=_genLang==='en';
  var heroVal=isEn?'Lily':'小桃桃';
  var html='<div class="b-gen-section"><h3>✨ 创作新绘本故事</h3><div class="b-lang-tabs"><button class="b-ltab zh'+(isEn?'':' on')+'" id="bGltZh" onclick="bSetGenLang(\'zh\')">🇨🇳 中文绘本</button><button class="b-ltab en'+(isEn?' on':'')+'" id="bGltEn" onclick="bSetGenLang(\'en\')">🇺🇸 English Story</button></div>';
  html+='<div class="b-gen-row" style="align-items:flex-start"><label style="padding-top:6px">主题</label><div><div id="bThemeGroups" style="display:flex;flex-direction:column;gap:8px;margin-bottom:8px"></div><div style="display:flex;align-items:center;gap:8px;margin-top:4px"><span class="b-custom-toggle" onclick="bToggleCustom()">✏️ 自定义主题/内容</span></div><div class="b-custom-box" id="bCustomBox"><textarea id="bCustomText" placeholder="输入你想要的故事主题或内容..." style="margin-top:6px;width:100%"></textarea></div></div></div>';
  html+='<div class="b-gen-row"><label id="bLblHero">主角</label><input type="text" id="bGenHero" value="'+heroVal+'" placeholder="'+heroVal+'"></div>';
  html+='<div class="b-gen-row"><label>页数</label><select id="bGenPages"><option value="4">4页（短）</option><option value="6" selected>6页（中）</option><option value="8">8页（长）</option><option value="12">12页（很长）</option></select></div>';
  html+='<div class="b-gen-row"><label>要求</label><input type="text" id="bGenExtra" placeholder="例如：要有科普知识；主角要很勇敢..."></div>';
  html+='<div style="display:flex;gap:8px"><button class="b-btn-gen zh" id="bBtnGen" style="flex:1;padding:12px;font-size:16px;margin-top:4px" onclick="bGenStory()">🎨 生成故事</button><button class="b-btn-nav" style="padding:8px 16px;margin-top:4px;font-family:var(--fzh);font-size:15px" onclick="bView=\'library\';pgBook()">← 返回</button></div></div>';
  html+='<div class="b-ld-panel" id="bLdWrap"><div class="b-ld-spinner"></div><div class="b-ld-steps" id="bLdSteps"></div><div class="b-ld-bar-wrap"><div class="b-ld-bar-fill" id="bLdFill"></div></div><div class="b-ld-txt" id="bLdTxt"></div></div>';
  page.innerHTML=html;bRenderThemes();
}
function bRenderReader(){
  if(!curBook)return;var isEn=curBook.lang==='en',page=$('page');
  var html='<div class="b-rdr-wrap"><div class="b-rdr-bar"><span class="b-rdr-title'+(isEn?' en':'')+'" id="bRdrTitle">'+curBook.title.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</span><span class="b-pg-ind" id="bPgInd">1/'+curBook.pages.length+'</span><button class="b-btn-nav" style="font-family:var(--fzh);padding:5px 10px;font-size:12px" onclick="bView=\'library\';curBook=null;pgBook()">✕ 返回</button></div><div class="b-rdr-body"><div class="b-page-frame"><div class="b-page-illus" id="bPageIllus"></div><div class="b-page-right" id="bPageRight"></div></div></div><div class="b-rdr-ctrl"><button class="b-btn-nav" id="bPrev" onclick="bChangePg(-1)">◀ 上页</button><button class="b-btn-read zh" id="bBtnRead" onclick="bReadAll()">🔊 <span id="bReadLabel">朗读</span></button><button class="b-btn-nav" id="bNext" onclick="bChangePg(1)">下页 ▶</button></div></div>';
  page.innerHTML=html;bRenderPg();
}

// ── 初始化书籍数据 ──
bInitData();
/* ══════════ 绘本板块结束 ══════════ */

</script>
</body>
</html>
